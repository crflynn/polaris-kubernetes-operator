# This rule is not used by the project polaris-kubernetes-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over polaris.apache.org.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: polaris-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: polariscatalogrolegrant-admin-role
rules:
- apiGroups:
  - polaris.apache.org
  resources:
  - polariscatalogrolegrants
  verbs:
  - '*'
- apiGroups:
  - polaris.apache.org
  resources:
  - polariscatalogrolegrants/status
  verbs:
  - get
