# This rule is not used by the project polaris-kubernetes-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the polaris.apache.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: polaris-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: polarisview-editor-role
rules:
- apiGroups:
  - polaris.apache.org
  resources:
  - polarisviews
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - polaris.apache.org
  resources:
  - polarisviews/status
  verbs:
  - get
