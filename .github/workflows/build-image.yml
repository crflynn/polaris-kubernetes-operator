name: Build Image

on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/build-image.yml'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/build-image.yml'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    name: Build Linux amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker buildx build --platform linux/amd64 --load --tag polaris-kubernetes-operator:ci .
