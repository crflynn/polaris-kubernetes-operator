name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.25

      - name: Install mise-managed project tools
        run: mise install

      - name: Verify Kind installation
        run: mise exec -C . -- kind version

      - name: Run Kind install, schema, and reconciliation E2E
        run: |
          go mod tidy
          mise exec -C . -- just test-e2e
