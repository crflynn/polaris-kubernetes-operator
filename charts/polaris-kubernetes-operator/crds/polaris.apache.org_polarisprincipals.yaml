                minLength: 1
                type: string
              credentialsSecretTemplate:
                description: credentialsSecretTemplate configures labels and annotations
                  on the credentials Secret.
                properties:
                  metadata:
                    description: metadata contains labels and annotations managed
                      on the credentials Secret.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: annotations are merged into the credentials Secret
                          and reconciled by this resource.
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: labels are merged into the credentials Secret
                          and reconciled by this resource.
                        type: object
