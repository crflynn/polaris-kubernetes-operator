metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: polarisprincipals.polaris.apache.org
spec:
  group: polaris.apache.org
  names:
    kind: PolarisPrincipal
    listKind: PolarisPrincipalList
    plural: polarisprincipals
    singular: polarisprincipal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.principalName
      name: Principal
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolarisPrincipalSpec defines the desired state of a Polaris
              principal.
            properties:
              connectionRef:
                description: connectionRef names a PolarisConnection in the same namespace.
                type: string
              credentialRotationRequestID:
                description: |-
                  credentialRotationRequestID requests one explicit credential rotation when greater than the last completed request ID.
                  Increase the value for every rotation request. Removing the field does not rotate credentials.
                format: int64
                minimum: 1
                type: integer
              credentialsSecretName:
                description: credentialsSecretName is the name of the same-namespace
