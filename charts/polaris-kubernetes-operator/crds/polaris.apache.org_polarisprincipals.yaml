                type: string
              credentialsSecretTemplateManagedAnnotationKeys:
                description: credentialsSecretTemplateManagedAnnotationKeys lists
                  annotation keys last managed by the Secret template.
                items:
                  type: string
                type: array
              credentialsSecretTemplateManagedLabelKeys:
                description: credentialsSecretTemplateManagedLabelKeys lists label
                  keys last managed by the Secret template.
                items:
                  type: string
                type: array
              entityVersion:
                description: entityVersion is Polaris' optimistic-concurrency version
                  for the principal.
                format: int64
                type: integer
              lastCredentialRotationRequestID:
                description: lastCredentialRotationRequestID records the last explicit
                  rotation request attempted.
                format: int64
                type: integer
              lastReconciledTime:
                description: lastReconciledTime is the last successful reconciliation.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation last reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
