{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "polaris-kubernetes-operator.metricsServiceName" . }}
  labels:
    {{- include "polaris-kubernetes-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: https
      port: {{ .Values.metrics.service.port }}
      protocol: TCP
      targetPort: https
  selector:
    app.kubernetes.io/name: {{ include "polaris-kubernetes-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
{{- end }}
