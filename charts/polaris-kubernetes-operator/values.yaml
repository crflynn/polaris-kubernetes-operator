replicaCount: 1

image:
  repository: ghcr.io/apache/polaris-kubernetes-operator
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when empty.
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Defaults to the chart fullname when empty.
  name: ""

rbac:
  create: true

manager:
  args:
    - --leader-elect
    - --health-probe-bind-address=:8081
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

metrics:
  enabled: true
  service:
    port: 8443

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
